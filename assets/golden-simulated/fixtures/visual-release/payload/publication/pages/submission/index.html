<!doctype html><html><body><main data-vr-id="workspace"><img class="brand-icon" src="assets/icon.svg" alt=""><section data-vr-id="identity-section"><label>Submission title<input data-vr-id="title-input" required></label></section><section data-vr-id="options-section"><label>Submission category<select data-vr-id="category-select"><option>standard</option><option>priority</option></select></label><label>Result quantity<input data-vr-id="quantity-input" type="number" required value="2"></label></section><section data-vr-id="upload-panel"><input data-vr-id="upload-input" type="file"><img class="sample-result" src="assets/sample-result.svg" alt="Sample result"></section><button data-vr-id="submit-button">Create submission</button><button data-vr-id="planned-export">External submission review</button><section data-vr-id="result-panel">No submission result</section><section data-vr-id="history-panel">No submission history</section></main><script>async function submit(){return fetch('/api/submissions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title:document.querySelector('[data-vr-id=title-input]').value,category:document.querySelector('[data-vr-id=category-select]').value,quantity:document.querySelector('[data-vr-id=quantity-input]').value})})}document.querySelector('[data-vr-id=submit-button]').addEventListener('click',submit);</script></body></html>
