<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample · AI Restore</title>
<link rel="stylesheet" href="../../suites/sample-suite/shared/tokens.css">
<link rel="stylesheet" href="../../suites/sample-suite/shared/components.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 800px; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 55%, #db2777 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 420px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 24px 60px rgba(17, 24, 39, 0.35);
    padding: 40px 36px 32px;
  }
  .logo {
    width: 48px; height: 48px;
    border-radius: 12px;
    background: linear-gradient(135deg, #4f46e5, #db2777);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px;
  }
  .logo svg { width: 26px; height: 26px; }
  h1 { font-size: 24px; color: #111827; margin-bottom: 6px; }
  .sub { font-size: 14px; color: #6b7280; margin-bottom: 28px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
  input {
    width: 100%; height: 44px;
    border: 1px solid #d1d5db; border-radius: 10px;
    padding: 0 14px; font-size: 14px; color: #111827;
    margin-bottom: 18px; outline: none;
  }
  input::placeholder { color: #9ca3af; }
  .btn {
    width: 100%; height: 46px;
    border: none; border-radius: 10px;
    background: #4f46e5; color: #fff;
    font-size: 15px; font-weight: 600;
    cursor: pointer; margin-top: 4px;
  }
  .foot {
    margin-top: 22px; text-align: center;
    font-size: 13px; color: #6b7280;
  }
  .foot a { color: #4f46e5; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l2.1 5.4L20 10l-5.9 1.6L12 17l-2.1-5.4L4 10l5.9-1.6z"/>
      </svg>
    </div>
    <h1 data-vr-id="welcome-title">欢迎回来</h1>
    <p class="sub" data-vr-id="welcome-subtitle">登录 AI Restore,继续你的还原验证之旅</p>
    <label for="email" data-vr-id="email-label">邮箱</label>
    <input id="email" data-vr-id="email-input" type="email" placeholder="you@example.com">
    <label for="pwd" data-vr-id="password-label">密码</label>
    <input id="pwd" data-vr-id="password-input" type="password" placeholder="••••••••">
    <button class="btn" data-vr-id="login-button">登 录</button>
    <p class="foot" data-vr-id="signup-prompt">还没有账号?<a href="#" data-vr-id="signup-link">立即注册</a></p>
  </div>
</body>
</html>

<button data-implementation-control="implementation-control-cap-suite-sample-detail">Submit suite-sample-detail</button>
